# PostgreSQL local para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: archeo
      POSTGRES_PASSWORD: archeo
      POSTGRES_DB: archeoarchive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
